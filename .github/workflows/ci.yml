name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be in the middle of a deploy (migrations).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: schedule_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_DB: schedule_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_OWNER_USER: app_owner
      POSTGRES_OWNER_PASSWORD: app_owner_ci
      POSTGRES_APP_USER: app_user
      POSTGRES_APP_PASSWORD: app_user_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/local.txt
      - name: Create database roles (app_owner, app_user)
        run: ../infra/docker/postgres/init-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - name: Typed API client is up to date with the backend
        run: |
          python manage.py spectacular --file ../frontend/packages/api-client/openapi.yaml
          git diff --exit-code -- ../frontend/packages/api-client/openapi.yaml \
            || (echo "Run scripts/generate-api-client.sh and commit the result." && exit 1)
      - run: pytest

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match openapi.yaml
        run: |
          pnpm --filter @saas/api-client generate
          git diff --exit-code -- packages/api-client/src/schema.d.ts \
            || (echo "Run scripts/generate-api-client.sh and commit the result." && exit 1)
      - run: pnpm turbo run lint typecheck test build

  e2e:
    name: End-to-end (Playwright, Workflows 3.1-3.3)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: schedule_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: "true"
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_DB: schedule_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_OWNER_USER: app_owner
      POSTGRES_OWNER_PASSWORD: app_owner_ci
      POSTGRES_APP_USER: app_user
      POSTGRES_APP_PASSWORD: app_user_ci
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000
      E2E_MANAGE: python manage.py
      E2E_MANAGE_CWD: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r backend/requirements/local.txt
      - name: Create database roles
        run: infra/docker/postgres/init-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
      - name: Migrate and start the API
        working-directory: backend
        run: |
          DJANGO_DB_ROLE=owner python manage.py migrate --noinput
          nohup python manage.py runserver 0.0.0.0:8000 > ../api.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @saas/admin build
          pnpm --filter @saas/admin exec playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: pnpm --filter @saas/admin e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/apps/admin/playwright-report
            frontend/apps/admin/test-results
            api.log

  terraform:
    name: Terraform (fmt, validate, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1
      - run: terraform fmt -check -recursive
      - name: Validate and test (mocked AWS provider, no credentials)
        run: |
          for stack in bootstrap environments/staging; do
            terraform -chdir=$stack init -backend=false -input=false
            terraform -chdir=$stack validate
          done
          terraform -chdir=environments/staging test
      - run: tflint --init --config "$PWD/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          for stack in bootstrap environments/staging modules/ecs_service; do
            tflint --config "$PWD/.tflint.hcl" --chdir $stack
          done

  deploy-staging:
    name: Deploy to staging
    # Every test job must pass first. Turned on by the STAGING_DEPLOY variable once AWS exists.
    needs: [backend, frontend, e2e, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC: short-lived AWS credentials, no stored keys
    env:
      API_IMAGE: ${{ vars.ECR_API_REPOSITORY }}:${{ github.sha }}
      ADMIN_IMAGE: ${{ vars.ECR_ADMIN_REPOSITORY }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build and push the admin console image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/apps/admin/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.ADMIN_IMAGE }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
      - name: Migrate and roll out
        run: scripts/deploy-ecs.sh
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_NAME_PREFIX: ${{ vars.ECS_NAME_PREFIX }}
          ECS_PRIVATE_SUBNETS: ${{ vars.ECS_PRIVATE_SUBNETS }}
          ECS_TASKS_SECURITY_GROUP: ${{ vars.ECS_TASKS_SECURITY_GROUP }}
          STAGING_URL: ${{ vars.STAGING_URL }}
