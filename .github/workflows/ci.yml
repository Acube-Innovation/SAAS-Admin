name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: schedule_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_DB: schedule_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_OWNER_USER: app_owner
      POSTGRES_OWNER_PASSWORD: app_owner_ci
      POSTGRES_APP_USER: app_user
      POSTGRES_APP_PASSWORD: app_user_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/local.txt
      - name: Create database roles (app_owner, app_user)
        run: ../infra/docker/postgres/init-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - name: Typed API client is up to date with the backend
        run: |
          python manage.py spectacular --file ../frontend/packages/api-client/openapi.yaml
          git diff --exit-code -- ../frontend/packages/api-client/openapi.yaml \
            || (echo "Run scripts/generate-api-client.sh and commit the result." && exit 1)
      - run: pytest

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match openapi.yaml
        run: |
          pnpm --filter @saas/api-client generate
          git diff --exit-code -- packages/api-client/src/schema.d.ts \
            || (echo "Run scripts/generate-api-client.sh and commit the result." && exit 1)
      - run: pnpm turbo run lint typecheck test build

  e2e:
    name: End-to-end (Playwright, Workflows 3.1-3.3)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: schedule_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: "true"
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_DB: schedule_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_OWNER_USER: app_owner
      POSTGRES_OWNER_PASSWORD: app_owner_ci
      POSTGRES_APP_USER: app_user
      POSTGRES_APP_PASSWORD: app_user_ci
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000
      E2E_MANAGE: python manage.py
      E2E_MANAGE_CWD: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r backend/requirements/local.txt
      - name: Create database roles
        run: infra/docker/postgres/init-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
      - name: Migrate and start the API
        working-directory: backend
        run: |
          DJANGO_DB_ROLE=owner python manage.py migrate --noinput
          nohup python manage.py runserver 0.0.0.0:8000 > ../api.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @saas/admin build
          pnpm --filter @saas/admin exec playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: pnpm --filter @saas/admin e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/apps/admin/playwright-report
            frontend/apps/admin/test-results
            api.log
