components:
  schemas:
    AcceptInviteRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
        full_name:
          type: string
          maxLength: 100
      required:
      - password
    AdminChangeRequest:
      type: object
      description: The client's view (portal).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        request_type:
          allOf:
          - $ref: '#/components/schemas/ChangeRequestTypeEnum'
          readOnly: true
        subject:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ChangeRequestStatusEnum'
          readOnly: true
        requested_by_name:
          type: string
          readOnly: true
        linked_version:
          allOf:
          - $ref: '#/components/schemas/LinkedVersion'
          readOnly: true
          nullable: true
        decline_reason:
          type: string
          readOnly: true
        comment_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        requested_by_email:
          type: string
          format: email
        assignee:
          allOf:
          - $ref: '#/components/schemas/StaffUser'
          readOnly: true
          nullable: true
      required:
      - assignee
      - closed_at
      - comment_count
      - created_at
      - decline_reason
      - description
      - id
      - linked_version
      - request_type
      - requested_by_email
      - requested_by_name
      - started_at
      - status
      - subject
      - tenant_id
      - tenant_name
      - updated_at
    AdminChangeRequestDetail:
      type: object
      description: The client's view (portal).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        request_type:
          allOf:
          - $ref: '#/components/schemas/ChangeRequestTypeEnum'
          readOnly: true
        subject:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ChangeRequestStatusEnum'
          readOnly: true
        requested_by_name:
          type: string
          readOnly: true
        linked_version:
          allOf:
          - $ref: '#/components/schemas/LinkedVersion'
          readOnly: true
          nullable: true
        decline_reason:
          type: string
          readOnly: true
        comment_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        requested_by_email:
          type: string
          format: email
        assignee:
          allOf:
          - $ref: '#/components/schemas/StaffUser'
          readOnly: true
          nullable: true
        comments:
          type: array
          items:
            $ref: '#/components/schemas/StaffComment'
          readOnly: true
      required:
      - assignee
      - closed_at
      - comment_count
      - comments
      - created_at
      - decline_reason
      - description
      - id
      - linked_version
      - request_type
      - requested_by_email
      - requested_by_name
      - started_at
      - status
      - subject
      - tenant_id
      - tenant_name
      - updated_at
    AdminChangeRequestUpdateStatusEnum:
      enum:
      - in_progress
      type: string
      description: '* `in_progress` - in_progress'
    Agency:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        legal_name:
          type: string
          readOnly: true
        gstin:
          type: string
          readOnly: true
          nullable: true
        address_line1:
          type: string
          readOnly: true
        address_line2:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        state:
