        required: true
      tags:
      - 'admin: clients'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
