        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      tags:
      - 'admin: clients'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSession'
          description: ''
  /api/admin/tenants/{id}/suspend:
    post:
      operationId: admin_tenants_suspend_create
      description: 'Clients (tenants) for the super admin console: spec 2.3 to 2.5,
        Workflows 3.1 to 3.3.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
