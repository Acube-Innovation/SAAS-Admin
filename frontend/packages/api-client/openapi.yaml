openapi: 3.0.3
info:
  title: Schedule Confirmation SaaS API
  version: 0.1.0
paths:
  /api/admin/industry-templates:
    get:
      operationId: admin_industry_templates_list
      description: Industry template editor (spec 2.6). PUT saves the whole definition
        as a new version.
      tags:
      - 'admin: industry templates'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndustryTemplate'
          description: ''
    post:
      operationId: admin_industry_templates_create
      description: Industry template editor (spec 2.6). PUT saves the whole definition
        as a new version.
      tags:
      - 'admin: industry templates'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TemplateInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TemplateInput'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndustryTemplate'
          description: ''
  /api/admin/industry-templates/{id}:
    get:
      operationId: admin_industry_templates_retrieve
      description: Industry template editor (spec 2.6). PUT saves the whole definition
        as a new version.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this industry template.
        required: true
      tags:
      - 'admin: industry templates'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndustryTemplate'
          description: ''
    put:
      operationId: admin_industry_templates_update
      description: Industry template editor (spec 2.6). PUT saves the whole definition
        as a new version.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this industry template.
        required: true
      tags:
      - 'admin: industry templates'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TemplateInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TemplateInput'
        required: true
