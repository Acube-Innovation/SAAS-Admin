          description: ''
  /api/admin/dev/whatsapp-versions/{vid}/simulate:
    post:
      operationId: admin_dev_whatsapp_versions_simulate_create
      description: 'Development only: act as Meta (then sync) or as the client''s
        owner on a version.'
      parameters:
      - in: path
        name: vid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'admin: dev'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimulateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SimulateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
          description: ''
  /api/admin/industry-templates:
    get:
      operationId: admin_industry_templates_list
      description: Industry template editor (spec 2.6). PUT saves the whole definition
        as a new version.
      tags:
      - 'admin: industry templates'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndustryTemplate'
          description: ''
    post:
      operationId: admin_industry_templates_create
      description: Industry template editor (spec 2.6). PUT saves the whole definition
        as a new version.
      tags:
      - 'admin: industry templates'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TemplateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TemplateInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndustryTemplate'
          description: ''
  /api/admin/industry-templates/{id}:
    get:
      operationId: admin_industry_templates_retrieve
      description: Industry template editor (spec 2.6). PUT saves the whole definition
        as a new version.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this industry template.
        required: true
      tags:
      - 'admin: industry templates'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndustryTemplate'
          description: ''
    put:
      operationId: admin_industry_templates_update
      description: Industry template editor (spec 2.6). PUT saves the whole definition
        as a new version.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this industry template.
        required: true
      tags:
      - 'admin: industry templates'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TemplateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TemplateInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndustryTemplate'
          description: ''
  /api/admin/industry-templates/{id}/versions:
    get:
      operationId: admin_industry_templates_versions_list
      description: Industry template editor (spec 2.6). PUT saves the whole definition
