        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
          description: ''
  /api/admin/tenants/{id}/users:
    get:
      operationId: admin_tenants_users_list
      description: 'Clients (tenants) for the super admin console: spec 2.3 to 2.5,
        Workflows 3.1 to 3.3.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      tags:
      - 'admin: clients'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipAdmin'
          description: ''
  /api/admin/tenants/{id}/users/{membership_id}/resend-invite:
    post:
      operationId: admin_tenants_users_resend_invite_create
      description: 'Clients (tenants) for the super admin console: spec 2.3 to 2.5,
        Workflows 3.1 to 3.3.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      - in: path
        name: membership_id
        schema:
          type: string
          pattern: ^[0-9a-f-]+$
        required: true
      tags:
      - 'admin: clients'
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/whatsapp-templates:
    get:
      operationId: admin_whatsapp_templates_list
      description: WhatsApp template editor and approval workflow (spec 2.7, Workflow
        3.4).
      parameters:
      - in: query
        name: language
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - disabled
          - draft
          - paused
          - rejected
          - sent_back
          - sent_to_client
          - signed_off
          - submitted
      - in: query
