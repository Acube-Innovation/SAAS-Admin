      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/invites/{token}:
    get:
      operationId: auth_invites_retrieve
      description: Check an invite link before showing the acceptance form.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteInfo'
          description: ''
  /api/auth/invites/{token}/accept:
    post:
      operationId: auth_invites_accept_create
      description: 'Accept an invite: set (or confirm) the password, activate the
        membership, sign in.'
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptInvite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptInvite'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
          description: ''
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: 'Step 1 of sign-in: email + password. The response says whether
        2FA comes next.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/me:
    get:
      operationId: auth_me_retrieve
      description: Current user and 2FA state. Available before 2FA so the frontend
        can route the user.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
          description: ''
  /api/auth/otp/confirm:
    post:
      operationId: auth_otp_confirm_create
      description: Finish set-up with the first code from the app. Marks the session
        as 2FA-verified.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpCode'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
          description: ''
  /api/auth/otp/setup:
    post:
      operationId: auth_otp_setup_create
      description: 'Start authenticator set-up: returns the otpauth:// URL (shown
        as a QR code) and secret.'
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSetup'
          description: ''
  /api/auth/otp/verify:
    post:
      operationId: auth_otp_verify_create
      description: 'Step 2 of sign-in for users with an authenticator: verify a 6-digit
        code.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpCode'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
          description: ''
  /api/auth/tenant:
    post:
      operationId: auth_tenant_create
      description: Choose the active tenant for users with more than one membership.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectTenant'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectTenant'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectTenant'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
          description: ''
  /api/health:
    get:
      operationId: health_retrieve
      description: Liveness check used by Docker Compose, the load balancer and monitoring.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          description: No response body
components:
  schemas:
    AcceptInvite:
      type: object
      properties:
        password:
          type: string
        full_name:
          type: string
          maxLength: 100
      required:
      - password
    Answer:
      type: object
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        label:
          type: string
          maxLength: 25
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        pick_next_delivery_days:
          type: integer
          maximum: 10
          minimum: 1
      required:
      - key
      - label
      - outcome
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: Empty for system actions.
          readOnly: true
        actor_email:
          type: string
          maxLength: 254
        support_session_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        action:
          type: string
          maxLength: 50
        object_type:
          type: string
          maxLength: 100
        object_id:
          type: string
          maxLength: 64
        before:
          nullable: true
        after:
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 500
      required:
      - action
      - actor_id
      - created_at
      - id
      - support_session_id
      - tenant_id
    AuthState:
      type: object
      description: 'What the frontend needs to route a user: who they are and which
        2FA step is next.'
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        platform_role:
          type: string
        requires_2fa:
          type: boolean
        otp_device_confirmed:
          type: boolean
        otp_verified:
          type: boolean
        otp_required:
          type: boolean
          description: Enter a code from the authenticator app.
        otp_setup_required:
          type: boolean
          description: Set up an authenticator app first.
        active_tenant_id:
          type: string
          format: uuid
          nullable: true
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
      required:
      - active_tenant_id
      - email
      - full_name
      - id
      - memberships
      - otp_device_confirmed
      - otp_required
      - otp_setup_required
      - otp_verified
      - platform_role
      - requires_2fa
    BlankEnum:
      enum:
      - ''
    Button:
      type: object
      properties:
        text:
          type: string
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
      required:
      - outcome
      - text
    CategoryEnum:
      enum:
      - utility
      type: string
      description: '* `utility` - Utility'
    ChannelOrderEnum:
      enum:
      - whatsapp
      - voice
      type: string
      description: |-
        * `whatsapp` - whatsapp
        * `voice` - voice
    Event:
      type: object
      properties:
        action:
          type: string
          maxLength: 30
        from_status:
          type: string
          maxLength: 20
        to_status:
          type: string
          maxLength: 20
        actor_email:
          type: string
          format: email
          nullable: true
        note:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - from_status
      - to_status
    EvidenceLink:
      type: object
      properties:
        url:
          type: string
          format: uri
      required:
      - url
    Field:
      type: object
      properties:
        key:
          type: string
          maxLength: 50
        label:
          type: string
          maxLength: 100
        field_type:
          $ref: '#/components/schemas/FieldTypeEnum'
        required:
          type: boolean
        is_core:
          type: boolean
        options: {}
        max_length:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        is_active:
          type: boolean
      required:
      - field_type
      - key
      - label
    FieldInput:
      type: object
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        label:
          type: string
          maxLength: 100
          minLength: 1
        field_type:
          $ref: '#/components/schemas/FieldTypeEnum'
        required:
          type: boolean
          default: false
        is_core:
          type: boolean
          readOnly: true
          default: false
        options:
          type: array
          items:
            type: string
            maxLength: 100
        max_length:
          type: integer
          maximum: 1000
          minimum: 1
          nullable: true
        is_active:
          type: boolean
          default: true
      required:
      - field_type
      - is_core
      - key
      - label
    FieldTypeEnum:
      enum:
      - text
      - number
      - date
      - phone
      - choice
      - boolean
      type: string
      description: |-
        * `text` - Text
        * `number` - Number
        * `date` - Date
        * `phone` - Phone
        * `choice` - Choice
        * `boolean` - Yes / No
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        redis:
          type: string
      required:
      - database
      - redis
      - status
    IndustryTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          description: Immutable, e.g. gas_agency.
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        is_active:
          type: boolean
        current_version:
          type: integer
          maximum: 2147483647
          minimum: 0
        clients_using:
          type: integer
          readOnly: true
        subscriber_fields:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        schedule_types:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleType'
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - clients_using
      - id
      - key
      - name
      - schedule_types
      - subscriber_fields
      - updated_at
    IndustryTemplateVersion:
      type: object
      properties:
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        definition: {}
        created_by_email:
          type: string
          format: email
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by_email
      - definition
      - version
    InviteInfo:
      type: object
      properties:
        email:
          type: string
          format: email
        tenant_name:
          type: string
        role:
          type: string
        expires_at:
          type: string
          format: date-time
        needs_new_password:
          type: boolean
        requires_2fa:
          type: boolean
      required:
      - email
      - expires_at
      - needs_new_password
      - requires_2fa
      - role
      - tenant_name
    LanguageEnum:
      enum:
      - ml
      - en
      - hi
      - ta
      type: string
      description: |-
        * `ml` - Malayalam
        * `en` - English
        * `hi` - Hindi
        * `ta` - Tamil
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    ManualSignoff:
      type: object
      properties:
        evidence:
          type: string
          format: uri
        note:
          type: string
          default: ''
          maxLength: 500
      required:
      - evidence
    Membership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        tenant_name:
          type: string
        tenant_status:
          type: string
        role:
          $ref: '#/components/schemas/TenantRoleEnum'
        status:
          $ref: '#/components/schemas/MembershipStatusEnum'
      required:
      - id
      - role
      - tenant_id
      - tenant_name
      - tenant_status
    MembershipAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/TenantRoleEnum'
        status:
          $ref: '#/components/schemas/MembershipStatusEnum'
        last_login:
          type: string
          format: date-time
          nullable: true
        otp_enabled:
          type: boolean
      required:
      - email
      - full_name
      - id
      - last_login
      - otp_enabled
      - role
    MembershipStatusEnum:
      enum:
      - invited
      - active
      - deactivated
      type: string
      description: |-
        * `invited` - Invited
        * `active` - Active
        * `deactivated` - Deactivated
    OtpCode:
      type: object
      properties:
        otp_code:
          type: string
          pattern: ^\d{6}$
      required:
      - otp_code
    OtpSetup:
      type: object
      properties:
        otpauth_url:
          type: string
          description: Show as a QR code in the authenticator app.
        secret:
          type: string
          description: Hex key, for manual entry.
      required:
      - otpauth_url
      - secret
    OutcomeEnum:
      enum:
      - confirmed
      - not_available
      - reschedule
      type: string
      description: |-
        * `confirmed` - confirmed
        * `not_available` - not_available
        * `reschedule` - reschedule
    PaginatedAuditLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
    PaginatedMembershipAdminList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/MembershipAdmin'
    PaginatedTemplateList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Template'
    PaginatedTenantList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
    PatchedTenant:
      type: object
      description: Client details and settings (spec 2.4 / 2.5). Validation matches
        the create form.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
          minLength: 2
        legal_name:
          type: string
          maxLength: 200
          minLength: 2
        gstin:
          type: string
          nullable: true
          maxLength: 15
        address_line1:
          type: string
          maxLength: 200
        address_line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        state:
          $ref: '#/components/schemas/StateEnum'
        pin_code:
          type: string
        contact_name:
          type: string
          maxLength: 100
        contact_phone:
          type: string
        contact_email:
          type: string
          format: email
          maxLength: 254
        default_language:
          $ref: '#/components/schemas/LanguageEnum'
        timezone:
          type: string
          maxLength: 50
        daily_send_cap:
          type: integer
          maximum: 100000
          minimum: 1
          default: 5000
        industry_template:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Required when a client is created (spec 2.4).
        industry_template_name:
          type: string
          readOnly: true
          nullable: true
        industry_template_version:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/TenantStatusEnum'
          readOnly: true
        suspended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        suspension_reason:
          type: string
          readOnly: true
        owner_email:
          type: string
          format: email
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedVersionEdit:
      type: object
      description: Template content; the spec 2.7 rules are applied by validation.validate_content().
      properties:
        header_text:
          type: string
        body:
          type: string
        footer:
          type: string
        buttons:
          type: array
          items:
            $ref: '#/components/schemas/Button'
        sample_values:
          type: object
          additionalProperties:
            type: string
    QuestionFlow:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
      required:
      - answers
    Reason:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 5
      required:
      - reason
    ReasonOptional:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 500
    ReminderRule:
      type: object
      properties:
        send_time:
          type: string
        days_before:
          type: integer
          maximum: 7
          minimum: 0
        wait_minutes:
          type: integer
          maximum: 1440
          minimum: 30
        quiet_start:
          type: string
        quiet_end:
          type: string
        delivery_weekdays:
          type: array
          items:
            type: integer
            maximum: 6
            minimum: 0
          maxItems: 7
          minItems: 1
        channel_order:
          type: array
          items:
            $ref: '#/components/schemas/ChannelOrderEnum'
          maxItems: 2
          minItems: 1
      required:
      - channel_order
      - days_before
      - delivery_weekdays
      - quiet_end
      - quiet_start
      - send_time
      - wait_minutes
    ScheduleType:
      type: object
      properties:
        key:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 100
        is_active:
          type: boolean
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        default_reminder_rule: {}
        default_question_flow: {}
      required:
      - fields
      - key
      - name
    ScheduleTypeInput:
      type: object
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        name:
          type: string
          maxLength: 100
          minLength: 2
        is_active:
          type: boolean
          default: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldInput'
        default_reminder_rule:
          $ref: '#/components/schemas/ReminderRule'
        default_question_flow:
          $ref: '#/components/schemas/QuestionFlow'
      required:
      - default_question_flow
      - default_reminder_rule
      - fields
      - key
      - name
    SelectTenant:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
      required:
      - tenant_id
    SignoffMethodEnum:
      enum:
      - client
      - manual
      type: string
      description: |-
        * `client` - Client
        * `manual` - Manual
    StateEnum:
      enum:
      - AN
      - AP
      - AR
      - AS
      - BR
      - CH
      - CG
      - DH
      - DL
      - GA
      - GJ
      - HR
      - HP
      - JK
      - JH
      - KA
      - KL
      - LA
      - LD
      - MP
      - MH
      - MN
      - ML
      - MZ
      - NL
      - OD
      - PY
      - PB
      - RJ
      - SK
      - TN
      - TS
      - TR
      - UP
      - UK
      - WB
      type: string
      description: |-
        * `AN` - Andaman and Nicobar Islands
        * `AP` - Andhra Pradesh
        * `AR` - Arunachal Pradesh
        * `AS` - Assam
        * `BR` - Bihar
        * `CH` - Chandigarh
        * `CG` - Chhattisgarh
        * `DH` - Dadra and Nagar Haveli and Daman and Diu
        * `DL` - Delhi
        * `GA` - Goa
        * `GJ` - Gujarat
        * `HR` - Haryana
        * `HP` - Himachal Pradesh
        * `JK` - Jammu and Kashmir
        * `JH` - Jharkhand
        * `KA` - Karnataka
