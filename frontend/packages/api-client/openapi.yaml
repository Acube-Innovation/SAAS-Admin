      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndustryTemplateVersion'
          description: ''
  /api/admin/reference-data:
    get:
      operationId: admin_reference_data_retrieve
      description: Choice lists for admin forms, so the UI uses exactly the server's
        lists (spec 2.4).
      tags:
      - 'admin: reference data'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceData'
          description: ''
  /api/admin/support-sessions/{id}/end:
    post:
      operationId: admin_support_sessions_end_create
      description: 'The signed-in staff user''s support session: the banner''s data
        and ending it.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this support session.
        required: true
      tags:
      - 'admin: support sessions'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSession'
          description: ''
  /api/admin/support-sessions/current:
    get:
      operationId: admin_support_sessions_current_retrieve
      description: 'The signed-in staff user''s support session: the banner''s data
        and ending it.'
      tags:
      - 'admin: support sessions'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSession'
          description: ''
        '204':
          description: No response body
  /api/admin/tenants:
    get:
      operationId: admin_tenants_list
      description: 'Clients (tenants) for the super admin console: spec 2.3 to 2.5,
        Workflows 3.1 to 3.3.'
      parameters:
      - in: query
        name: industry_template
        schema:
          type: string
        description: Template key, e.g. gas_agency
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -name
          - created_at
          - name
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Name, legal name, GSTIN or owner email
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - suspended
      tags:
      - 'admin: clients'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTenantList'
          description: ''
    post:
      operationId: admin_tenants_create
      description: 'Clients (tenants) for the super admin console: spec 2.3 to 2.5,
        Workflows 3.1 to 3.3.'
      tags:
      - 'admin: clients'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
          description: ''
  /api/admin/tenants/{id}:
    get:
      operationId: admin_tenants_retrieve
      description: 'Clients (tenants) for the super admin console: spec 2.3 to 2.5,
        Workflows 3.1 to 3.3.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      tags:
      - 'admin: clients'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
          description: ''
    patch:
      operationId: admin_tenants_partial_update
      description: 'Clients (tenants) for the super admin console: spec 2.3 to 2.5,
        Workflows 3.1 to 3.3.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      tags:
      - 'admin: clients'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTenantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTenantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTenantRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
          description: ''
  /api/admin/tenants/{id}/activate:
