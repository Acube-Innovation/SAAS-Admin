openapi: 3.0.3
info:
  title: Schedule Confirmation SaaS API
  version: 0.1.0
paths:
  /api/admin/audit-logs:
    get:
      operationId: admin_audit_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
        description: Part of the actor's email
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: From this day (India time), inclusive
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Up to this day (India time), inclusive
      - in: query
        name: object_type
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: tenant
        schema:
          type: string
        description: Client id
      tags:
      - 'admin: audit log'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEntryList'
          description: ''
  /api/admin/audit-logs/export:
    get:
      operationId: admin_audit_logs_export_retrieve
      description: CSV of every entry matching the filters, newest first. The export
        is itself audited.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
        description: Part of the actor's email
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: From this day (India time), inclusive
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Up to this day (India time), inclusive
      - in: query
        name: object_type
        schema:
          type: string
      - in: query
        name: tenant
        schema:
          type: string
        description: Client id
      tags:
      - 'admin: audit log'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
  /api/admin/audit-logs/facets:
    get:
      operationId: admin_audit_logs_facets_retrieve
      description: Values for the Client, Action and Record filters.
      tags:
      - 'admin: audit log'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogFacets'
          description: ''
  /api/admin/change-requests:
    get:
      operationId: admin_change_requests_list
      description: The change requests queue (admin spec 2.9, Workflow 3.6). Both
        platform roles.
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
        description: A staff user id, `me` or `none`
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: request_type
        schema:
          type: string
          enum:
          - edit_template
          - new_language
          - new_template
          - other
          - voice_script
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - declined
          - done
          - in_progress
          - open
      - in: query
        name: tenant
        schema:
          type: string
      tags:
      - 'admin: change requests'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminChangeRequestList'
          description: ''
  /api/admin/change-requests/{id}:
    get:
      operationId: admin_change_requests_retrieve
      description: The change requests queue (admin spec 2.9, Workflow 3.6). Both
        platform roles.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this change request.
        required: true
      tags:
      - 'admin: change requests'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChangeRequestDetail'
          description: ''
    patch:
      operationId: admin_change_requests_partial_update
      description: The change requests queue (admin spec 2.9, Workflow 3.6). Both
        platform roles.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this change request.
        required: true
      tags:
      - 'admin: change requests'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminChangeRequestUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminChangeRequestUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminChangeRequestUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChangeRequestDetail'
          description: ''
  /api/admin/change-requests/{id}/comments:
    post:
      operationId: admin_change_requests_comments_create
      description: The change requests queue (admin spec 2.9, Workflow 3.6). Both
        platform roles.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this change request.
        required: true
      tags:
      - 'admin: change requests'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChangeRequestDetail'
          description: ''
  /api/admin/change-requests/{id}/decline:
    post:
      operationId: admin_change_requests_decline_create
      description: The change requests queue (admin spec 2.9, Workflow 3.6). Both
        platform roles.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this change request.
        required: true
      tags:
      - 'admin: change requests'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeclineRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeclineRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChangeRequestDetail'
          description: ''
  /api/admin/change-requests/{id}/link-version:
    post:
      operationId: admin_change_requests_link_version_create
      description: The change requests queue (admin spec 2.9, Workflow 3.6). Both
        platform roles.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this change request.
        required: true
      tags:
      - 'admin: change requests'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkVersionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkVersionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LinkVersionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChangeRequestDetail'
          description: ''
  /api/admin/change-requests/{id}/versions:
    get:
      operationId: admin_change_requests_versions_list
      description: Template versions of this client that are still in progress (can
        be linked).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this change request.
        required: true
      tags:
      - 'admin: change requests'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandidateVersion'
          description: ''
  /api/admin/change-requests/assignees:
    get:
      operationId: admin_change_requests_assignees_list
      description: Platform staff a request can be assigned to.
      tags:
      - 'admin: change requests'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffUser'
          description: ''
  /api/admin/dashboard:
    get:
      operationId: admin_dashboard_retrieve
      tags:
      - 'admin: dashboard'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
