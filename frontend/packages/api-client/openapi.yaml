  /api/admin/tenants:
    get:
      operationId: admin_tenants_list
      description: 'Clients (tenants) for the super admin console: spec 2.3 to 2.5,
        Workflows 3.1 to 3.3.'
      parameters:
      - in: query
        name: industry_template
        schema:
          type: string
        description: Template key, e.g. gas_agency
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -name
          - created_at
          - name
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Name, legal name, GSTIN or owner email
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - suspended
      tags:
      - 'admin: clients'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTenantList'
          description: ''
    post:
      operationId: admin_tenants_create
      description: 'Clients (tenants) for the super admin console: spec 2.3 to 2.5,
        Workflows 3.1 to 3.3.'
      tags:
      - 'admin: clients'
